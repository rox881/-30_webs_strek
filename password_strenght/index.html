<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Sternght</title>
    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <div class="container">
        <div class="input-box">
            <input type="password" id="password" placeholder="password">
            <button id="btn"><img src="arrow.png"></button>
            <p id="msg">The Password is<span id="str"></span></p>
        </div>


    </div>
    <script>
        let btn = document.getElementById("btn");
        let pass = document.getElementById("password");
        let str = document.getElementById("str");
        let msg = document.getElementById("msg");

        btn.onclick = function () {

            if (pass.value.length > 0) {
                msg.style.display = "block";
                str.style.display = "block";
            }
            else {
                msg.style.display = "none";
                str.style.display = "none";
            }
            if (pass.value.length <= 4) {
                str.innerHTML = "weak";
                str.style.color = "green";
                pass.style.color = "green";

            }
            if (pass.value.length > 4 && pass.value.length < 8) {
                str.innerHTML = "midium";
                str.style.color = "yellow";
                pass.style.color = "yellow";

            }
            if (pass.value.length > 8) {
                str.innerHTML = "Strong";
                str.style.color = "red";
                pass.style.color = "red";
            }
        }
    </script>


</body>

</html>
