<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password_Strength</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h3>Coming Soon !</h3>
        <h1>Our band New <br>Website on its Way</h1>
        <p>Subscribe For the Notification</p>
        <form name="submit-to-google-sheet">
            <input type="Email" class="email" name="Email" placeholder="Enter Your Email Here">
            <button type="submit"><img src="email-subs-img\send-icon.png"> </button>
        </form>
        <span id="sucsessMag"></span>
    </div>

</body>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwXDziVT7ECWMhFY1e8OHzfWeMC2CNBmNSPhUWeAg13ECOHPCIT_LQe-CKIaF_ohO_hTQ/exec'
    const form = document.forms['submit-to-google-sheet']
    const sucsessMag = document.getElementById("sucsessMag")


    form.addEventListener('submit', e => {
        e.preventDefault()
        fetch(scriptURL, { method: 'POST', body: new FormData(form) })
            .then(response =>
                sucsessMag.innerHTML = "Thanks for Subscribing!",
                setTimeout(function () {
                    sucsessMag.innerHTML = ""
                }, 5000),
                form.reset()
            )
            .catch(error => console.error('Error!', error.message))
    })
</script>

</html>
