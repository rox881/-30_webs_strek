<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image_Transform</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <nav>
            <img src="portfolio_site_img\portfolio_site_img\logo.png" class="logo">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">ABOUT</a></li>
                <li><a href="">PROTFOLIO</a></li>
                <li><a href="">SERVICES</a></li>
                <li><a href="">HIRE ME </a></li>
            </ul>
            <img src="portfolio_site_img\portfolio_site_img\moon.png" id="icon">
        </nav>
        <div class="info">
            <h1>I'm <span>Kate</span>Ameli</h1>
            <p>This is my portfolio Website to showcase <br>all my work here over to be </p>
            <a href="">DownLoad CV</a>
        </div>
        <div class="img-box">
            <img src="portfolio_site_img\portfolio_site_img\pattern.png" class="back-img ">
            <img src="portfolio_site_img\portfolio_site_img\girl.png" class="girl">
        </div>

    </div>
    <script>
        let icon = document.getElementById("icon");

        icon.onclick = function () {
            document.body.classList.toggle("dark-theme");
            if (document.body.classList.contains("dark-theme")) {
                icon.src = "portfolio_site_img\portfolio_site_img\sun.png";
            }
            else {
                icon.src = "portfolio_site_img\portfolio_site_img\moon.png";
            }
        }

    </script>

</body>

</html>
