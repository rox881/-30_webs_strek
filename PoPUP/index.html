<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPUP</title>
    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <div class="container">
        <buttton class="btn " class="btn" type="submit" onclick="openPopup()">Submit</buttton>
        <div class="popup" id="popup">
            <img src="image.png">
            <h2>Thank You</h2>
            <p>Your Deatails has been Submitted. Thanks!</p>
            <button type="button" onclick="closePopup()">OK</button>
        </div>

    </div>
    <script>
        let popup = document.getElementById("popup");

        function openPopup() {
            popup.classList.add("open-popup");
        }
        function closePopup() {
            popup.classList.remove("open-popup");
        }
    </script>
</body>

</html>
